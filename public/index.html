<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Rush</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="join-screen" id="join-screen">
        <div class="join-card">
          <p class="eyebrow">Mini game multiplayer</p>
          <h1>STAR RUSH</h1>
          <p class="subtitle">Entre na arena, colete estrelas e tente liderar o placar em 60 segundos.</p>
          <label class="field-label" for="nickname">Digite seu apelido:</label>
          <input id="nickname" maxlength="12" autocomplete="off" placeholder="Seu nome" />
          <button id="play-button">JOGAR</button>
          <p class="status-message" id="join-message"></p>
        </div>
      </section>

      <section class="game-screen hidden" id="game-screen">
        <div class="arena-stage">
          <div class="canvas-card">
            <canvas id="game-canvas" width="900" height="600"></canvas>

            <div class="arena-overlay arena-topbar">
              <div class="game-title">STAR RUSH</div>
              <div class="timer-pill" id="timer">TEMPO: 60s</div>
            </div>

            <aside class="arena-overlay scoreboard">
              <div class="scoreboard-header">
                <h2>PLACAR</h2>
                <button class="scoreboard-toggle" id="scoreboard-toggle" type="button" aria-label="Mostrar ou esconder placar">
                  TOP 4
                </button>
              </div>
              <div class="score-list" id="score-list"></div>
              <p class="score-hint" id="score-hint">Use WASD ou as setas para correr pela arena.</p>
            </aside>

            <div class="winner-banner hidden" id="winner-banner"></div>

            <section class="touch-controls" aria-label="Controles por toque">
              <div class="joystick-shell">
                <div class="joystick-base" id="joystick-base" aria-label="Joystick virtual">
                  <div class="joystick-ring"></div>
                  <div class="joystick-knob" id="joystick-knob"></div>
                </div>
              </div>
            </section>
          </div>
        </div>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/game.js"></script>
  </body>
</html>
